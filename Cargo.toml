[workspace]
resolver = "3"
members = [
    "crates/xtask",
    "crates/fe56_dscr_protocol",
    "crates/fe56_app",
    "crates/fe56_translation",
    "crates/fe56_translation_test",
    "crates/fe56_ucd_sys",
]

[workspace.dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[profile.release-dbg]
inherits = "release"
debug = true

[profile.release-lto]
inherits = "release"
codegen-units = 1
lto = true
